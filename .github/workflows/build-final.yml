name: Build BlockSound Agent

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: 'temurin'

    - name: Verify Minecraft JAR exists
      run: |
        if [ ! -f libs/minecraft-1.7.10.jar ]; then
          echo "ERROR: libs/minecraft-1.7.10.jar not found!"
          echo "Please upload Minecraft 1.7.10 JAR to libs/ folder"
          exit 1
        fi
        echo "Minecraft JAR found: $(ls -lh libs/minecraft-1.7.10.jar)"

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: BlockSound-Agent
        path: target/BlockSound-Agent.jar
