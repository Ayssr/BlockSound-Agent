name: Build BlockSound Agent with Maven

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        java-version: '8'
        distribution: 'temurin'
    
    - name: Download Minecraft JAR
      run: |
        mkdir -p libs
        wget https://launcher.mojang.com/v1/objects/e80d9b3bf5085c99e5ebc2a66c6697de0c2bf9b7/client.jar -O libs/minecraft-1.7.10.jar
    
    - name: Build with Maven
      run: mvn -B package
    
    - name: Upload JAR
      uses: actions/upload-artifact@v3
      with:
        name: BlockSound-Agent
        path: target/BlockSound-Agent.jar
